spring.application.name=sayhii-backend

# ===== Server =====
server.port=8080

# ===== PostgreSQL (Supabase Session Pooler) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.cteejbloxyzznrddynbh}
spring.datasource.password=${DB_PASSWORD:YOUR_SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Base64 encoded 256-bit secret
jwt.secret=${JWT_SECRET:dGhpc2lzYXN1cGVyc2VjcmV0a2V5Zm9yc2F5aGlpYXBwMjAyNg==}
jwt.expiration=86400000

# ===== WebSocket / CORS =====
spring.websocket.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
