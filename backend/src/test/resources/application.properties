spring.application.name=sayhii-backend-test

# Use in-memory H2 database for testing with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT configuration for tests
jwt.secret=dGhpc2lzYXN1cGVyc2VjcmV0a2V5Zm9yc2F5aGlpYXBwMjAyNg==
jwt.expiration=86400000

# WebSocket / CORS
spring.websocket.allowed-origins=http://localhost:3000
